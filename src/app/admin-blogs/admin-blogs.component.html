<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold mb-4">Blogs Management</h1>
  <button (click)="showModal = true; isEditing = false" class="bg-blue-500 text-white p-2 rounded mb-4">Add
    Blog</button>

  <table class="table-auto w-full border-collapse border border-gray-300">
    <thead class="bg-gray-100">
      <tr>
        <th class="border px-4 py-2">Title</th>
        <th class="border px-4 py-2">Content</th>
        <th class="border px-4 py-2">Category</th>
        <th class="border px-4 py-2">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let blog of blogs">
        <td class="border px-4 py-2">{{ blog.title }}</td>
        <td class="border px-4 py-2">{{ blog.content }}</td>
        <td class="border px-4 py-2">{{ blog.category.name }}</td>
        <td class="border px-4 py-2">
          <button class="bg-yellow-500 text-white p-1 rounded mr-2" (click)="openEditModal(blog)">Edit</button>
          <button class="bg-red-500 text-white p-1 rounded" (click)="deleteBlog(blog._id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal for Adding/Editing Blog -->
  <div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white p-6 rounded shadow-md">
      <h2 class="text-xl font-bold mb-4">{{ isEditing ? 'Edit Blog' : 'Add Blog' }}</h2>

<!-- Title -->
<input [(ngModel)]="editingBlog.title" *ngIf="isEditing" class="border p-2 w-full mb-4" />
<input [(ngModel)]="newBlog.title" *ngIf="!isEditing" class="border p-2 w-full mb-4" />

<!-- Content -->
<textarea [(ngModel)]="editingBlog.content" *ngIf="isEditing" class="border p-2 w-full mb-4"></textarea>
<textarea [(ngModel)]="newBlog.content" *ngIf="!isEditing" class="border p-2 w-full mb-4"></textarea>

<!-- Category -->
<select [(ngModel)]="editingBlog.category" *ngIf="isEditing" class="border p-2 w-full mb-4">
  <option *ngFor="let category of categories" [value]="category._id">
    {{ category.name }}
  </option>
</select>
<select [(ngModel)]="newBlog.category" *ngIf="!isEditing" class="border p-2 w-full mb-4">
  <option *ngFor="let category of categories" [value]="category._id">
    {{ category.name }}
  </option>
</select>



      <button (click)="isEditing ? updateBlog() : createBlog()" class="bg-green-500 text-white p-2 rounded mr-2">
        {{ isEditing ? 'Update' : 'Save' }}
      </button>
      <button (click)="showModal = false" class="bg-gray-500 text-white p-2 rounded">Cancel</button>
    </div>
  </div>
</div>
