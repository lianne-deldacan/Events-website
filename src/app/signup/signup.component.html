<!-- Signup Page -->
<div class="min-h-screen flex items-center justify-center bg-[#F3EEEA] p-6">
  <div class="flex bg-white shadow-lg rounded-lg overflow-hidden w-[80%] max-w-4xl">
    <!-- Form Section -->
    <div class="w-1/2 p-8">
      <h2 class="text-3xl font-bold text-[#28282B] mb-6 text-center">Sign Up</h2>
      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-[#776B5D] font-medium">First Name</label>
          <input type="text" formControlName="firstName" class="w-full p-3 border border-[#776B5D] rounded" required>
        </div>
        <div class="mb-4">
          <label class="block text-[#776B5D] font-medium">Last Name</label>
          <input type="text" formControlName="lastName" class="w-full p-3 border border-[#776B5D] rounded" required>
        </div>
        <div class="mb-4">
          <label class="block text-[#776B5D] font-medium">Email</label>
          <input type="email" formControlName="email" class="w-full p-3 border border-[#776B5D] rounded" required>
        </div>
        <div class="mb-4">
          <label class="block text-[#776B5D] font-medium">Password</label>
          <input type="password" formControlName="password" class="w-full p-3 border border-[#776B5D] rounded" required>
        </div>
        <div class="mb-4">
          <label class="block text-[#776B5D] font-medium">Phone Number</label>
          <input type="tel" formControlName="phoneNumber" class="w-full p-3 border border-[#776B5D] rounded" required>
        </div>
        <div class="mb-4">
          <label class="block text-[#776B5D] font-medium">Address</label>
          <textarea formControlName="address" class="w-full p-3 border border-[#776B5D] rounded" required></textarea>
        </div>
        <button type="submit" class="w-full bg-[#776B5D] text-white p-3 rounded">Sign Up</button>
      </form>
    </div>
    <!-- Image Section -->
    <div class="w-1/2">
      <img src="assets/signup.jpg" alt="Signup Image" class="w-full h-full object-cover">
    </div>
  </div>
</div>
