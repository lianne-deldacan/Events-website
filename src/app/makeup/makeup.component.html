<div class="container mx-auto my-8">
  <h1 class="text-3xl font-bold text-center mb-8">Our Makeup Artists</h1>
  <div class="flex flex-wrap justify-center gap-8">
    <div *ngFor="let artist of makeupArtists" class="w-80 bg-white shadow-lg rounded-lg overflow-hidden">
      <img [src]="artist.imageUrl" [alt]="artist.name" class="w-full h-96 object-cover">
      <div class="p-4">
        <h2 class="text-xl font-bold text-gray-800">{{ artist.name }}</h2>
        <p class="text-gray-600 mt-2">{{ artist.background }}</p>
      </div>
    </div>
  </div>
</div>

<div class="container mx-auto my-8">
  <h1 class="text-3xl font-bold text-center mb-8">Our Hair Stylists</h1>
  <div class="flex flex-wrap justify-center gap-8">
    <div *ngFor="let stylist of hairStylists" class="w-80 bg-white shadow-lg rounded-lg overflow-hidden">
      <img [src]="stylist.imageUrl" [alt]="stylist.name" class="w-full h-96 object-cover">
      <div class="p-4">
        <h2 class="text-xl font-bold text-gray-800">{{ stylist.name }}</h2>
        <p class="text-gray-600 mt-2">{{ stylist.background }}</p>
      </div>
    </div>
  </div>
</div>
