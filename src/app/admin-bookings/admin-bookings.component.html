<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold text-center mb-6">Appointment Management</h1>

  <!-- Table for displaying bookings -->
  <div class="overflow-x-auto">
    <table class="table-auto border-collapse border border-gray-300 w-full">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-4 py-2">Name</th>
          <th class="border px-4 py-2">Email</th>
          <th class="border px-4 py-2">Phone</th>
          <th class="border px-4 py-2">Event Type</th>
          <th class="border px-4 py-2">Participants</th>
          <th class="border px-4 py-2">Date</th>
          <th class="border px-4 py-2">Time</th>
          <th class="border px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let booking of bookings" class="hover:bg-gray-50">
          <td class="border px-4 py-2">{{ booking.name }}</td>
          <td class="border px-4 py-2">{{ booking.email }}</td>
          <td class="border px-4 py-2">{{ booking.phone }}</td>
          <td class="border px-4 py-2">{{ booking.eventType }}</td>
          <td class="border px-4 py-2">{{ booking.participants }}</td>
          <td class="border px-4 py-2">{{ booking.appointmentDate | date }}</td>
          <td class="border px-4 py-2">{{ booking.appointmentTime }}</td>
          <td class="border px-4 py-2">
            <button (click)="editBooking(booking._id)"
              class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600">
              Edit
            </button>
            <button (click)="deleteBooking(booking._id)"
              class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 ml-2">
              Delete
            </button>
            <button class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">
              Approved
            </button>
            <button class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600 ml-2">
              Decline
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
