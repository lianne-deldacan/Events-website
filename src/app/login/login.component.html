<div class="bg-[#219C90] min-h-screen flex items-center justify-center">
  <div class="login-container max-w-sm w-full bg-white p-8 rounded-lg shadow-lg">
    <h2 class="text-3xl font-bold text-[#219C90] text-center mb-6">Login</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
      <div class="mb-6">
        <label for="email" class="block text-[#219C90] font-semibold mb-2">Email</label>
        <input id="email" formControlName="email" type="email"
          class="w-full px-4 py-2 border border-[#E9B824] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <div class="mb-6">
        <label for="password" class="block text-[#219C90] font-semibold mb-2">Password</label>
        <input id="password" formControlName="password" type="password"
          class="w-full px-4 py-2 border border-[#E9B824] rounded-md focus:outline-none focus:ring-2 focus:ring-[#D83F31] focus:border-[#D83F31]" />
      </div>
      <button type="submit"
        class="w-full bg-[#219C90] text-white py-2 px-4 rounded-md hover:bg-[#D83F31] transition ease-in-out duration-300"
        [disabled]="loginForm.invalid">Login</button>
    </form>
    <p *ngIf="errorMessage" class="error text-red-500 text-center mt-4">{{ errorMessage }}</p>
  </div>
</div>
