<div class="bg-[#219C90] min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-lg w-96 mx-4 my-6">
    <h2 class="text-3xl font-bold text-center text-[#219C90] mb-6">Sign Up</h2>
    <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">

      <!-- First Name -->
      <div class="mb-4">
        <label for="firstName" class="block text-sm font-medium text-[#219C90]">First Name</label>
        <input type="text" id="firstName" formControlName="firstName"
          class="w-full p-3 border border-[#E9B824] rounded mt-1 focus:outline-none focus:ring-2 focus:ring-[#D83F31]"
          required>
        <div *ngIf="signUpForm.get('firstName')?.invalid && signUpForm.get('firstName')?.touched"
          class="text-red-500 text-sm">First Name is required</div>
      </div>

      <!-- Last Name -->
      <div class="mb-4">
        <label for="lastName" class="block text-sm font-medium text-[#219C90]">Last Name</label>
        <input type="text" id="lastName" formControlName="lastName"
          class="w-full p-3 border border-[#E9B824] rounded mt-1 focus:outline-none focus:ring-2 focus:ring-[#D83F31]"
          required>
        <div *ngIf="signUpForm.get('lastName')?.invalid && signUpForm.get('lastName')?.touched"
          class="text-red-500 text-sm">Last Name is required</div>
      </div>

      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-[#219C90]">Email</label>
        <input type="email" id="email" formControlName="email"
          class="w-full p-3 border border-[#E9B824] rounded mt-1 focus:outline-none focus:ring-2 focus:ring-[#D83F31]"
          required>
        <div *ngIf="signUpForm.get('email')?.invalid && signUpForm.get('email')?.touched" class="text-red-500 text-sm">
          Please enter a valid email
        </div>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-[#219C90]">Password</label>
        <input type="password" id="password" formControlName="password"
          class="w-full p-3 border border-[#E9B824] rounded mt-1 focus:outline-none focus:ring-2 focus:ring-[#D83F31]"
          required>
        <div *ngIf="signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched"
          class="text-red-500 text-sm">Password is required</div>
      </div>

      <!-- Phone Number -->
      <div class="mb-4">
        <label for="phoneNumber" class="block text-sm font-medium text-[#219C90]">Phone Number</label>
        <input type="tel" id="phoneNumber" formControlName="phoneNumber"
          class="w-full p-3 border border-[#E9B824] rounded mt-1 focus:outline-none focus:ring-2 focus:ring-[#D83F31]"
          required>
        <div *ngIf="signUpForm.get('phoneNumber')?.invalid && signUpForm.get('phoneNumber')?.touched"
          class="text-red-500 text-sm">Phone Number is required</div>
      </div>

      <!-- Address -->
      <div class="mb-4">
        <label for="address" class="block text-sm font-medium text-[#219C90]">Address</label>
        <textarea id="address" formControlName="address"
          class="w-full p-3 border border-[#E9B824] rounded mt-1 focus:outline-none focus:ring-2 focus:ring-[#D83F31]"
          rows="3" required></textarea>
        <div *ngIf="signUpForm.get('address')?.invalid && signUpForm.get('address')?.touched"
          class="text-red-500 text-sm">Address is required</div>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-center">
        <button type="submit" [disabled]="signUpForm.invalid"
          class="bg-[#219C90] text-white px-6 py-3 rounded-md hover:bg-[#D83F31] transition duration-300 ease-in-out">
          Sign Up
        </button>
      </div>
    </form>
  </div>
</div>
