<div class="container mx-auto my-8">
  <h1 class="text-3xl font-bold text-center mb-8">Our Hosts</h1>
  <div class="flex flex-wrap justify-center gap-6">
    <div *ngFor="let host of hosts" class="w-64 bg-white shadow-lg rounded-lg overflow-hidden">
      <img [src]="host.imageUrl" [alt]="host.name" class="w-full h-80 object-cover">
      <div class="p-4">
        <h2 class="text-xl font-bold text-gray-800">{{ host.name }}</h2>
        <p class="text-gray-600 mt-2">{{ host.background }}</p>
      </div>
    </div>
  </div>
</div>
