<div class="container mx-auto p-6">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold text-gray-700 text-center mb-6">Appointment Booking Form</h2>
    <form>
      <!-- Client Details -->
      <div class="mb-4">
        <label for="name" class="block text-gray-700 font-medium mb-2">Full Name</label>
        <input type="text" id="name"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Enter your full name" />
      </div>

      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
        <input type="email" id="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Enter your email" />
      </div>

      <div class="mb-4">
        <label for="phone" class="block text-gray-700 font-medium mb-2">Phone Number</label>
        <input type="text" id="phone"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Enter your phone number" />
      </div>

      <!-- Event Details -->
      <div class="mb-4">
        <label for="eventType" class="block text-gray-700 font-medium mb-2">Event Type</label>
        <select id="eventType"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300">
          <option value="" disabled selected>Select event type</option>
          <option value="wedding">Wedding</option>
          <option value="kiddie-birthdays">Kiddie Birthdays</option>
          <option value="baptism">Baptism</option>
          <option value="adult-birthdays">Adult Birthdays</option>
          <option value="debut">Debut</option>
          <option value="corporate">Corporate</option>
        </select>
      </div>

      <div class="mb-4">
        <label for="participants" class="block text-gray-700 font-medium mb-2">Expected Participants</label>
        <input type="number" id="participants"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Enter number of participants" />
      </div>

      <!-- Appointment Date and Time -->
      <div class="mb-4">
        <label for="appointmentDate" class="block text-gray-700 font-medium mb-2">Preferred Appointment Date</label>
        <input type="date" id="appointmentDate"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300" />
      </div>

      <div class="mb-4">
        <label for="appointmentTime" class="block text-gray-700 font-medium mb-2">Preferred Appointment Time</label>
        <select id="appointmentTime"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300">
          <option value="" disabled selected>Select time</option>
          <option value="08:00">8:00 AM</option>
          <option value="09:00">9:00 AM</option>
          <option value="10:00">10:00 AM</option>
          <option value="11:00">11:00 AM</option>
          <option value="12:00">12:00 PM</option>
          <option value="13:00">1:00 PM</option>
          <option value="14:00">2:00 PM</option>
          <option value="15:00">3:00 PM</option>
          <option value="16:00">4:00 PM</option>
          <option value="17:00">5:00 PM</option>
        </select>
      </div>

      <!-- Additional Notes -->
      <div class="mb-4">
        <label for="notes" class="block text-gray-700 font-medium mb-2">Additional Notes</label>
        <textarea id="notes" rows="4"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:ring-blue-300"
          placeholder="Enter any additional information or preferences"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="text-center">
        <button type="submit"
          class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none focus:ring focus:ring-blue-300">
          Book Appointment
        </button>
      </div>
    </form>
  </div>
</div>
