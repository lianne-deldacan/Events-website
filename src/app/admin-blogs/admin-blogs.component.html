<div class="container mx-auto p-6">
  <h1 class="text-2xl font-bold text-center mb-6">Blogs Management</h1>

  <!-- Add Blog Button -->
  <div class="text-right mb-4">
    <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700" (click)="openCreateModal()">
      Add Blog
    </button>
  </div>

  <!-- Table to Display Blogs -->
  <div class="overflow-x-auto">
    <table class="table-auto border-collapse border border-gray-300 w-full">
      <thead class="bg-gray-100">
        <tr>
          <th class="border px-4 py-2">Title</th>
          <th class="border px-4 py-2">Content</th>
          <th class="border px-4 py-2">Author</th>
          <th class="border px-4 py-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let blog of blogs" class="hover:bg-gray-50">
          <td class="border px-4 py-2">{{ blog.title }}</td>
          <td class="border px-4 py-2">{{ blog.content }}</td>
          <td class="border px-4 py-2">{{ blog.author }}</td>
          <td class="border px-4 py-2 text-center">
            <button class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600" (click)="editBlog(blog)">
              Edit
            </button>
            <button class="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700 ml-2"
              (click)="deleteBlog(blog._id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Blog Modal -->
  <div class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50" *ngIf="showCreateModal">
    <div class="bg-white p-6 rounded shadow-md w-1/2">
      <h2 class="text-xl font-bold mb-4">Add New Blog</h2>
      <form>
        <div class="mb-4">
          <label class="block text-gray-700 font-bold mb-2" for="title">Title</label>
          <input id="title" type="text" class="w-full p-2 border border-gray-300 rounded" [(ngModel)]="newBlog.title" />
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-bold mb-2" for="content">Content</label>
          <textarea id="content" class="w-full p-2 border border-gray-300 rounded"
            [(ngModel)]="newBlog.content"></textarea>
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-bold mb-2" for="author">Author</label>
          <input id="author" type="text" class="w-full p-2 border border-gray-300 rounded"
            [(ngModel)]="newBlog.author" />
        </div>
        <div class="text-right">
          <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 mr-2" (click)="addBlog()">
            Save
          </button>
          <button class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-500" (click)="closeCreateModal()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
