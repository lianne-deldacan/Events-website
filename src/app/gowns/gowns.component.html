<div *ngFor="let category of gownCategories" class="mb-8">
  <h2 class="text-2xl font-bold text-center mb-4">{{ category.category }}</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
    <div *ngFor="let gown of category.gowns" class="border rounded shadow p-4">
      <div class="overflow-hidden rounded aspect-[3/4] bg-gray-100">
        <img [src]="gown.imageUrl" alt="{{ gown.name }}" class="w-full h-full object-cover">
      </div>
      <div class="mt-2">
        <h3 class="text-lg font-semibold">{{ gown.name }}</h3>
        <p class="text-gray-700">Price: ${{ gown.price }}</p>
      </div>
    </div>
  </div>
</div>
