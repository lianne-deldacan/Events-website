<div class="p-4 mt-4">
  <!-- Header with Create Category Button -->
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-bold">Categories Management</h2>
    <button (click)="openCreateModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
      + Create Category
    </button>
  </div>

  <!-- Modal for Creating Category -->
  <div *ngIf="showCreateModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50">
    <div class="bg-white rounded shadow-lg p-6 w-1/3">
      <h3 class="text-xl font-bold mb-4">Create New Category</h3>
      <input [(ngModel)]="newCategoryName" placeholder="Enter category name"
        class="border border-gray-300 rounded px-4 py-2 mb-4 w-full" />
      <div class="flex justify-end">
        <button (click)="addCategory()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 mr-2">
          Add Category
        </button>
        <button (click)="closeCreateModal()" class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Data Table -->
  <table class="min-w-full bg-white border border-gray-200 shadow-md">
    <thead>
      <tr class="bg-gray-200 text-left">
        <th class="px-4 py-2 border">ID</th>
        <th class="px-4 py-2 border">Name</th>
        <th class="px-4 py-2 border">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories">
        <td class="px-4 py-2 border">{{ category._id }}</td>
        <td class="px-4 py-2 border">{{ category.name }}</td>
        <td class="px-4 py-2 border">
          <button (click)="editCategory(category)"
            class="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600">
            Edit
          </button>
          <button (click)="deleteCategory(category._id)"
            class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
